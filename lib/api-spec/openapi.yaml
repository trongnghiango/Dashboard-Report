openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Production Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: production
    description: Production records
  - name: analytics
    description: Analytics and summaries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /production:
    get:
      operationId: listProduction
      tags: [production]
      summary: List production records
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
        - name: maySoi
          in: query
          schema: { type: string }
        - name: donHang
          in: query
          schema: { type: string }
        - name: lenhXK
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of production records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductionListResponse"
    post:
      operationId: createProduction
      tags: [production]
      summary: Create production record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Production"

  /production/{id}:
    get:
      operationId: getProduction
      tags: [production]
      summary: Get production record by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Production record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Production"
        "404":
          description: Not found
    patch:
      operationId: updateProduction
      tags: [production]
      summary: Update production record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Production"
    delete:
      operationId: deleteProduction
      tags: [production]
      summary: Delete production record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /analytics/summary:
    get:
      operationId: getSummary
      tags: [analytics]
      summary: Get dashboard KPI summary
      parameters:
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /analytics/output-trend:
    get:
      operationId: getOutputTrend
      tags: [analytics]
      summary: Daily output trend over time
      parameters:
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Output trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutputTrendPoint"

  /analytics/waste-breakdown:
    get:
      operationId: getWasteBreakdown
      tags: [analytics]
      summary: Waste breakdown by type
      parameters:
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Waste breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WasteBreakdown"

  /analytics/order-completion:
    get:
      operationId: getOrderCompletion
      tags: [analytics]
      summary: Order completion rates
      parameters:
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Order completion data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderCompletion"

  /analytics/shift-performance:
    get:
      operationId: getShiftPerformance
      tags: [analytics]
      summary: Output performance by shift (Ca 1, Ca 2, Ca 3)
      parameters:
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Shift performance data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftPerformance"

