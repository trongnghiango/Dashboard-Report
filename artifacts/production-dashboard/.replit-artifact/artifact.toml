kind = "web"
previewPath = "/"
title = "Báo Cáo Sản Xuất"
version = "1.0.0"
id = "artifacts/production-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24975

[services.development]
run = "pnpm --filter @workspace/production-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/production-dashboard", "run", "build" ]
publicDir = "artifacts/production-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24975"
BASE_PATH = "/"
